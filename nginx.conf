events {
  worker_connections 1024;
}

http {
  upstream auth_service {
    server auth-service:3001;
  }

  upstream board_service {
    server board-service-1:3000;
    server board-service-2:3000;
    server board-service-3:3000;
  }

  # ============================================================
  # Server 1: HTTP (80)
  # 역할 1 - ACME Challenge: Let's Encrypt 인증서 발급/갱신 시
  #           certbot이 이 경로로 소유권 검증 파일을 서빙
  # 역할 2 - Redirect: 그 외 모든 HTTP 요청을 HTTPS로 리다이렉트
  # ============================================================
  server {
    listen 80;
    server_name hsm9411-board.duckdns.org;  # ← 발급받은 DuckDNS 도메인으로 교체

    # certbot webroot 방식: 인증서 발급할 때만 이 경로를 조회함
    # certbot이 /var/www/certbot/ 에 임시 파일을 생성하고
    # Let's Encrypt가 이 URL로 접근해서 소유권을 검증
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # 나머지 모든 HTTP 요청은 HTTPS로 301 리다이렉트
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ============================================================
  # Server 2: HTTPS (443)
  # 실제 API 트래픽 처리
  # ============================================================
  server {
    listen 443 ssl;
    server_name hsm9411-board.duckdns.org;  # ← 발급받은 DuckDNS 도메인으로 교체

    # SSL 인증서 경로 (certbot이 발급 후 여기에 저장)
    # 컨테이너 내부 경로 = 호스트의 /app/certbot/conf 볼륨 마운트
    ssl_certificate     /etc/letsencrypt/live/hsm9411-board.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hsm9411-board.duckdns.org/privkey.pem;

    # 권장 SSL 설정 (TLS 1.2/1.3만 허용, 취약한 프로토콜 차단)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ---- Auth Service ----

    location /auth/health {
      proxy_pass http://auth_service/health;
      proxy_set_header Host $host;
    }

    location /auth/metrics {
      proxy_pass http://auth_service/metrics;
      proxy_set_header Host $host;
    }

    location /auth/ {
      proxy_pass http://auth_service/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/api {
      proxy_pass http://auth_service/api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/api/ {
      proxy_pass http://auth_service/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Board Service ----

    location /health {
      proxy_pass http://board_service;
      proxy_set_header Host $host;
    }

    location /metrics {
      proxy_pass http://board_service;
      proxy_set_header Host $host;
    }

    location /api {
      proxy_pass http://board_service/api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://board_service/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://board_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
